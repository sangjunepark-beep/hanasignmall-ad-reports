<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>광고보고서 빌드 — 톱니 감시판</title>
<style>
  :root{
    --bg:#f7f6f3; --card:#ffffff; --line:#e3e1d9; --tx:#2c2c2a; --tx2:#6b6a64;
    --ok:#1d9e75; --okbg:#e1f5ee; --okln:#9fe1cb;
    --run:#185fa5; --runbg:#e6f1fb; --runln:#b5d4f4;
    --bad:#cf3b3b; --badbg:#fceleb; --badbg:#fcebeb; --badln:#f09595;
    --idle:#b4b2a9; --idlebg:#f1efe8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:24px;}
  .wrap{max-width:820px;margin:0 auto;}
  h1{font-size:20px;font-weight:600;margin:0 0 4px;}
  .sub{font-size:13px;color:var(--tx2);margin-bottom:20px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;}
  .track{position:relative;margin:6px 0 0;}
  .rail{position:absolute;top:24px;left:9%;right:9%;height:2px;background:var(--line);}
  .gear{position:absolute;top:4px;left:10%;transform:translateX(-50%);transition:left .55s ease;z-index:3;color:var(--run);}
  .gear svg{display:block;animation:spin 2.6s linear infinite;}
  .gear.jam{color:var(--bad);}
  .gear.jam svg{animation-play-state:paused;}
  .gear.fin{color:var(--ok);}
  @keyframes spin{to{transform:rotate(360deg);}}
  .stages{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:60px;}
  .st{border:1px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center;background:var(--card);transition:all .25s;}
  .st .nm{font-size:13px;font-weight:600;margin-top:2px;}
  .st .stt{font-size:11px;color:var(--tx2);margin-top:5px;}
  .st.ok{border-color:var(--okln);background:var(--okbg);} .st.ok .nm{color:var(--ok);} .st.ok .stt{color:var(--ok);}
  .st.run{border-color:var(--runln);background:var(--runbg);} .st.run .nm{color:var(--run);}
  .st.fault{border:2px solid var(--bad);background:var(--badbg);} .st.fault .nm,.st.fault .stt{color:var(--bad);}
  .st.idle{background:var(--idlebg);} .st.idle .nm{color:var(--idle);}
  .panel{margin-top:18px;border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.6;}
  .panel.good{background:var(--okbg);color:#0f6e56;}
  .panel.bad{background:var(--badbg);color:#791f1f;}
  .panel.wait{background:var(--idlebg);color:var(--tx2);}
  .panel b{font-weight:600;}
  .panel .err{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:rgba(0,0,0,.04);padding:2px 6px;border-radius:5px;}
  .fix{margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,.08);}
  button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 14px;cursor:pointer;}
  button:hover{background:#efeee8;}
  .ldot{width:8px;height:8px;border-radius:50%;display:inline-block;}
</style>
</head>
<body>
<div class="wrap">
  <h1>광고보고서 빌드 — 톱니 감시판</h1>
  <div class="sub">
    <span id="updated">불러오는 중…</span>
    <span id="target"></span>
    <button onclick="load()">새로고침</button>
  </div>
  <div class="card">
    <div class="track">
      <div class="rail"></div>
      <div class="gear" id="gear">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </div>
      <div class="stages" id="stages"></div>
    </div>
    <div class="panel wait" id="panel">상태를 불러오는 중…</div>
  </div>
</div>

<script>
const N = 5;
const KNOWN = [
  {k:/UNAUTHENTICATED|401|invalid_grant|expired|version/i, why:"구글애즈 API 인증/버전 문제 가능", fix:"build_report.py 의 구글애즈 API 버전 숫자(vNN) 또는 G_REFRESH 토큰 확인"},
  {k:/ZeroDivision/i, why:"0으로 나눔 (노출/클릭 0인 날)", fix:"분모 0 방어 코드 — 0이면 ROAS 계산 건너뛰기"},
  {k:/KeyError|IndexError/i, why:"기대한 데이터 칼럼/항목이 비어있음", fix:"해당 API 응답 구조 변경 여부 확인, 빈 값 기본처리"},
  {k:/timeout|URLError|ConnectionError|getaddrinfo|HTTP 5\d\d/i, why:"외부 API 일시 장애·네트워크", fix:"보통 재시도하면 해결 — 수동 재실행(workflow_dispatch)"},
  {k:/푸시 실패|gh_put/i, why:"깃헙 푸시 거부", fix:"GITHUB_TOKEN 권한·만료 확인"},
];
function fixFor(err){ for(const r of KNOWN) if(r.k.test(err||"")) return r; return {why:"알려진 패턴 아님", fix:"아래 에러 메시지로 해당 단계 로그를 직접 확인"}; }

function place(i){ document.getElementById('gear').style.left = ((i+0.5)/N*100)+'%'; }

function render(data){
  const stages = data.stages || [];
  document.getElementById('updated').textContent = '갱신: ' + (data.updated ? new Date(data.updated).toLocaleString('ko-KR') : '-');
  document.getElementById('target').textContent = data.target ? ('대상일: ' + data.target) : '';
  const box = document.getElementById('stages'); box.innerHTML='';
  let firstFault = -1, allOk = true;
  stages.forEach((s,i)=>{
    let cls = s.status==='ok'?'ok':s.status==='fault'?'fault':s.status==='진행'?'run':'idle';
    if(s.status==='fault' && firstFault<0) firstFault=i;
    if(s.status!=='ok') allOk=false;
    const label = {ok:'정상',fault:'멈춤',진행:'점검중',대기:'미도달'}[s.status]||s.status;
    const d=document.createElement('div'); d.className='st '+cls;
    d.innerHTML=`<div class="nm">${i+1}. ${s.name}</div><div class="stt">${label}${s.ts?' · '+s.ts:''}</div>`;
    box.appendChild(d);
  });

  const gear=document.getElementById('gear'); gear.className='gear';
  const stop = firstFault>=0 ? firstFault : (allOk? N-1 : stages.findIndex(s=>s.status!=='ok'));
  let i=0; place(0);
  const sweep=setInterval(()=>{
    place(i);
    if(i>=stop){
      clearInterval(sweep);
      if(firstFault>=0){
        gear.classList.add('jam'); place(firstFault);
        const s=stages[firstFault], f=fixFor(s.error);
        document.getElementById('panel').className='panel bad';
        document.getElementById('panel').innerHTML=
          `<b>${firstFault+1}단계 「${s.name}」에서 톱니 걸림</b><br>에러: <span class="err">${(s.error||'(메시지 없음)')}</span>`+
          `<div class="fix"><b>추정 원인:</b> ${f.why}<br><b>수정안:</b> ${f.fix}</div>`;
      } else if(allOk){
        gear.classList.add('fin'); place(N-1);
        document.getElementById('panel').className='panel good';
        document.getElementById('panel').innerHTML='<b>전 단계 정상.</b> 톱니가 막힘 없이 한 바퀴 돌았습니다.';
      } else {
        document.getElementById('panel').className='panel wait';
        document.getElementById('panel').innerHTML='아직 빌드 전이거나 일부 단계 미도달 상태입니다.';
      }
    }
    i++;
  }, 520);
}

async function load(){
  try{
    const r = await fetch('status.json?t='+Date.now());
    if(!r.ok) throw new Error('status.json 없음 (HTTP '+r.status+')');
    render(await r.json());
  }catch(e){
    document.getElementById('panel').className='panel wait';
    document.getElementById('panel').textContent='상태 파일을 못 읽었습니다: '+e.message+' — 빌드가 한 번 돌면 생성됩니다.';
    document.getElementById('updated').textContent='갱신: -';
  }
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
