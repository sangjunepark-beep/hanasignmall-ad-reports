name: Daily CEO Report (target 08:00 KST)

on:
  schedule:
    # 03:17 KST (18:17 UTC 전일) 시작 의도
    # GitHub Actions schedule이 최근 ~4h 지연되는 패턴 → 실측 ~07:17 KST 실행 예상
    # 비정시(:17)로 잡아 정시 큐 지연 회피
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build CEO Report
        env:
          A_KEY: ${{ secrets.NAVER_A_KEY }}
          A_SEC: ${{ secrets.NAVER_A_SEC }}
          B_KEY: ${{ secrets.NAVER_B_KEY }}
          B_SEC: ${{ secrets.NAVER_B_SEC }}
          G_DEV: ${{ secrets.G_DEV }}
          G_OAUTH_C: ${{ secrets.G_OAUTH_C }}
          G_OAUTH_S: ${{ secrets.G_OAUTH_S }}
          G_REFRESH: ${{ secrets.G_REFRESH }}
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          WORKSPACE_DIR: ${{ github.workspace }}/scripts
        run: |
          cd "$GITHUB_WORKSPACE/scripts"
          python build_report.py
